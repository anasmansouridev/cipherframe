# nginx config for the Docker image (Hostinger VPS / EasyPanel). Cloudflare Pages ignores this file.
# Security headers come from security-headers.conf, generated at build time from public/_headers.
server_tokens off;

gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain application/xml text/xml;

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Hashed build output: cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The Work films and the showcase media keep their file names, so cache for a day rather than a year.
    location ~ ^/(work|showcase)/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }

    # The page itself: always revalidate, so a new deploy shows up straight away.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri $uri/ =404;
    }
}

# www.example.com -> example.com (only used if you add the www domain in EasyPanel too).
# TLS is terminated by EasyPanel's proxy, so the redirect target is https.
server {
    listen 80;
    server_name ~^www\.(?<apex>.+)$;
    return 301 https://$apex$request_uri;
}
